    </linearGradient>
    <linearGradient id="bandGreen" x1="0%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#48DB42"/>
      <stop offset="55%" stop-color="#28B62C"/>
      <stop offset="100%" stop-color="#169222"/>
    </linearGradient>
    <linearGradient id="bandYellow" x1="0%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFDF38"/>
      <stop offset="55%" stop-color="#F7C116"/>
      <stop offset="100%" stop-color="#E59B08"/>
    </linearGradient>
    <linearGradient id="bandOrange" x1="10%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FF621A"/>
      <stop offset="100%" stop-color="#E63910"/>
    </linearGradient>
    <linearGradient id="bandRed" x1="15%" y1="10%" x2="85%" y2="90%">
