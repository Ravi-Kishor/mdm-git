    <linearGradient id="arrowTopFacet" x1="0%" y1="15%" x2="95%" y2="75%">
      <stop offset="0%" stop-color="#22B22A"/>
      <stop offset="48%" stop-color="#3CD643"/>
      <stop offset="100%" stop-color="#62EB67"/>
    </linearGradient>
    <linearGradient id="arrowBottomFacet" x1="10%" y1="20%" x2="95%" y2="75%">
      <stop offset="0%" stop-color="#116E19"/>
