name: Build and Release Tarball

on:
  push:
    tags:
      - 'v*' # Triggers automatically on git tags (e.g., v0.5.2)
  workflow_dispatch: # Enables manual triggering from the GitHub Actions tab

jobs:
  build-tarball:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Git Version
        id: get_version
        run: |
          GIT_DESCRIBE=$(git describe --tags --always | sed 's/^v//')
          PKGVER=$(echo "$GIT_DESCRIBE" | sed 's/-/./g; s/-/r/')
          echo "PKGVER=$PKGVER" >> $GITHUB_ENV
          echo "Version: $PKGVER"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libclang-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            build-essential \
            jq \
            tar \
            gzip

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      # Find where Cargo.toml is located and set up working directory automatically
      - name: Locate Project Directory
        id: find_cargo
        run: |
          CARGO_DIR=$(find . -name "Cargo.toml" -maxdepth 2 -not -path "*/.*" | xargs dirname | head -n 1)
          if [ "$CARGO_DIR" = "." ] || [ -z "$CARGO_DIR" ]; then
            echo "CARGO_PATH=." >> $GITHUB_ENV
            echo "Found Cargo.toml at root"
          else
            # Strip leading ./
            CARGO_PATH="${CARGO_DIR#./}"
            echo "CARGO_PATH=$CARGO_PATH" >> $GITHUB_ENV
            echo "Found Cargo.toml in subdirectory: $CARGO_PATH"
          fi

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workdir: "${{ env.CARGO_PATH }}"

      - name: Build Release Binaries
        working-directory: "${{ env.CARGO_PATH }}"
        run: |
          cargo build --release

      - name: Prepare Release Asset Bundle
        env:
          PKGVER: ${{ env.PKGVER }}
          CARGO_PATH: ${{ env.CARGO_PATH }}
        run: |
          BUNDLE_DIR="MisterDownloadManager-${PKGVER}-linux-x86_64"
          mkdir -p "$BUNDLE_DIR"

          # Resolve target path dynamically depending on whether it's in root or a subfolder
          TARGET_DIR="${CARGO_PATH}/target/release"
          [[ "$CARGO_PATH" == "." ]] && TARGET_DIR="target/release"

          # Copy core binaries
          cp "$TARGET_DIR/misterdownloadmanager" "$BUNDLE_DIR/"
          [[ -f "$TARGET_DIR/misterdownloadmanager-nmhost" ]] && cp "$TARGET_DIR/misterdownloadmanager-nmhost" "$BUNDLE_DIR/"

          # Copy browser extensions and docs from repo root if they exist
          [[ -d "extension-chromium" ]] && cp -r extension-chromium "$BUNDLE_DIR/"
          [[ -f "mdm-firefox.xpi" ]] && cp mdm-firefox.xpi "$BUNDLE_DIR/"
          [[ -f "LICENSE" ]] && cp LICENSE "$BUNDLE_DIR/"
          [[ -f "ATTRIBUTION.md" ]] && cp ATTRIBUTION.md "$BUNDLE_DIR/"

          # Create tarball
          tar -czvf "${BUNDLE_DIR}.tar.gz" "$BUNDLE_DIR"
          echo "ARCHIVE_NAME=${BUNDLE_DIR}.tar.gz" >> $GITHUB_ENV

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
