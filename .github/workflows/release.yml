name: Generic Linux Release (x86-64-v3)

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC (auto-skips if upstream is unchanged)

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

  # Compiler & Linker (Clang + LLD with Safe ICF)
  CC: clang
  CXX: clang++
  CFLAGS: "-march=x86-64-v3 -O2 -pipe -fno-plt"
  CXXFLAGS: "-march=x86-64-v3 -O2 -pipe -fno-plt"
  RUSTFLAGS: "-C target-cpu=x86-64-v3 -C linker=clang -C link-arg=-fuse-ld=lld -C link-arg=-Wl,-O2,--as-needed,--icf=safe"

  # Cargo release profile overrides (avoids breaking proc-macros/build scripts)
  CARGO_PROFILE_RELEASE_LTO: "fat"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
  CARGO_PROFILE_RELEASE_PANIC: "abort"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
  CARGO_PROFILE_RELEASE_STRIP: "symbols"

jobs:
  build-linux-generic:
    name: Build Linux tar.gz (x86-64-v3)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check upstream commit and existing release
        id: check
        run: |
          set -euo pipefail
          FULL_SHA=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/anefzaoui/misterdownloadmanager/commits/main" \
            | jq -r '.sha')
          test -n "$FULL_SHA" && test "$FULL_SHA" != "null"

          SHORT_SHA="${FULL_SHA:0:7}"
          echo "sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          # Skip scheduled builds if a release for this upstream commit already exists
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases?per_page=10" \
              | jq -e --arg sha "$SHORT_SHA" '.[] | select(.tag_name | contains($sha))' >/dev/null; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Release for upstream commit ${SHORT_SHA} already exists. Skipping build."
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream repository
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: anefzaoui/misterdownloadmanager
          ref: ${{ steps.check.outputs.sha }}
          persist-credentials: false

      - name: Install Linux build dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld pigz cmake nasm libclang-dev \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Setup Rust Toolchain
        if: steps.check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        if: steps.check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: x64v3-fatlto-o2-lld

      - name: Build Optimized Release Binaries
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cargo build --release --locked
          cargo build --release --locked -p mdm-nmhost

      - name: Package Generic Linux tar.gz
        if: steps.check.outputs.skip != 'true'
        id: pkg
        run: |
          set -euo pipefail
          mkdir -p mdm-linux-x64v3

          if [ -f target/release/misterdownloadmanager ]; then
            install -m755 target/release/misterdownloadmanager mdm-linux-x64v3/
          elif [ -f target/release/mdm ]; then
            install -m755 target/release/mdm mdm-linux-x64v3/
          else
            echo "Main binary not found in target/release" >&2
            exit 1
          fi

          if [ -f target/release/misterdownloadmanager-nmhost ]; then
            install -m755 target/release/misterdownloadmanager-nmhost mdm-linux-x64v3/
          fi

          # Final strip pass for any C/C++ static library symbols
          llvm-strip --strip-all mdm-linux-x64v3/* 2>/dev/null || strip mdm-linux-x64v3/*

          # High-ratio multi-threaded gzip compression (standard .tar.gz)
          tar -I "pigz -9" -cf misterdownloadmanager-linux-x86_64-v3.tar.gz -C mdm-linux-x64v3 .
          ls -lh mdm-linux-x64v3/ misterdownloadmanager-linux-x86_64-v3.tar.gz

      - name: Upload Package Artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: misterdownloadmanager-linux-x86_64-v3
          path: misterdownloadmanager-linux-x86_64-v3.tar.gz
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}-${{ steps.check.outputs.short_sha }}"
          name: "Optimized x64-v3 Build #${{ github.run_number }} (${{ steps.check.outputs.short_sha }})"
          body: |
            Automated Linux `x86-64-v3` optimized release of MisterDownloadManager built from upstream commit [`${{ steps.check.outputs.short_sha }}`](https://github.com/anefzaoui/misterdownloadmanager/commit/${{ steps.check.outputs.sha }}).

            - **Flags:** `target-cpu=x86-64-v3`, `opt-level=2`, Fat LTO, `codegen-units=1`, `panic=abort`, Clang + LLD (`--icf=safe`), stripped
            - **Archive:** `misterdownloadmanager-linux-x86_64-v3.tar.gz`
          files: misterdownloadmanager-linux-x86_64-v3.tar.gz
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
          prerelease: false
