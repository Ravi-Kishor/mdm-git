name: Build and Release Tarball

on:
  push:
    tags:
      - 'v*' # Triggers automatically on git tags (e.g., v0.5.2)

jobs:
  build-tarball:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Git Version
        id: get_version
        run: |
          GIT_DESCRIBE=$(git describe --tags --always | sed 's/^v//')
          PKGVER=$(echo "$GIT_DESCRIBE" | sed 's/-/./g; s/-/r/')
          echo "PKGVER=$PKGVER" >> $GITHUB_ENV
          echo "Version: $PKGVER"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libclang-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            build-essential \
            jq \
            tar \
            gzip

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binaries
        run: |
          cargo build --release

      - name: Prepare Release Asset Bundle
        env:
          PKGVER: ${{ env.PKGVER }}
        run: |
          BUNDLE_DIR="MisterDownloadManager-${PKGVER}-linux-x86_64"
          mkdir -p "$BUNDLE_DIR"

          # Copy core binaries
          cp target/release/misterdownloadmanager "$BUNDLE_DIR/"
          [[ -f "target/release/misterdownloadmanager-nmhost" ]] && cp target/release/misterdownloadmanager-nmhost "$BUNDLE_DIR/"

          # Copy browser extensions and docs if they exist
          [[ -d "extension-chromium" ]] && cp -r extension-chromium "$BUNDLE_DIR/"
          [[ -f "mdm-firefox.xpi" ]] && cp mdm-firefox.xpi "$BUNDLE_DIR/"
          [[ -f "LICENSE" ]] && cp LICENSE "$BUNDLE_DIR/"
          [[ -f "ATTRIBUTION.md" ]] && cp ATTRIBUTION.md "$BUNDLE_DIR/"

          # Create tarball
          tar -czvf "${BUNDLE_DIR}.tar.gz" "$BUNDLE_DIR"
          echo "ARCHIVE_NAME=${BUNDLE_DIR}.tar.gz" >> $GITHUB_ENV

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
