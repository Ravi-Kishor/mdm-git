name: Generic Linux Release (x86-64-v3)

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# Required to allow the workflow to create and upload to GitHub Releases
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Force x86-64-v3 instructions, max optimization, Link Time Optimization, single codegen unit, and abort on panic for minimum size.
  RUSTFLAGS: "-C target-cpu=x86-64-v3 -C opt-level=3 -C lto=fat -C codegen-units=1 -C panic=abort"
  # Ensure any C/C++ build dependencies are also fully optimized for x86-64-v3
  CFLAGS: "-march=x86-64-v3 -O3"
  CXXFLAGS: "-march=x86-64-v3 -O3"

jobs:
  build-linux-generic:
    name: Build Linux tar.gz (x86-64-v3)
    runs-on: ubuntu-latest
    # Increased timeout to 90 minutes because lto=fat and codegen-units=1 make the build process significantly longer
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: 'anefzaoui/misterdownloadmanager' # Pulls the actual source code
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev cmake libclang-dev nasm

      - name: Setup Rust Toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Cache Cargo registry and target directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-x64v3-lto-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-x64v3-lto-

      - name: Build Optimized Release Binary
        run: cargo build --release

      - name: Build Native Messaging Host
        # Ensure the browser extension helper is also built
        run: cargo build --release -p mdm-nmhost

      - name: Package Generic Linux tar.gz
        run: |
          mkdir -p mdm-linux-x64v3
          
          # Copy the compiled binaries
          cp target/release/misterdownloadmanager mdm-linux-x64v3/ 2>/dev/null || cp target/release/mdm mdm-linux-x64v3/
          cp target/release/misterdownloadmanager-nmhost mdm-linux-x64v3/ 2>/dev/null || true
          
          # Strip the debug symbols to drastically reduce file size
          strip mdm-linux-x64v3/misterdownloadmanager 2>/dev/null || strip mdm-linux-x64v3/mdm
          strip mdm-linux-x64v3/misterdownloadmanager-nmhost 2>/dev/null || true
          
          # Archive it into a generic tarball
          tar -czvf misterdownloadmanager-linux-x86_64-v3.tar.gz -C mdm-linux-x64v3 .

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: misterdownloadmanager-linux-x86_64-v3
          path: misterdownloadmanager-linux-x86_64-v3.tar.gz
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Optimized x64-v3 Build #${{ github.run_number }}"
          body: "Automated Linux x86-64-v3 optimized release of MisterDownloadManager with LTO for size reduction, tracking the upstream main branch."
          files: misterdownloadmanager-linux-x86_64-v3.tar.gz
          draft: false
          prerelease: false
