name: Build Arch Package & Release

on:
  push:
    tags:
      - 'v*' # Triggers automatically on git tags (e.g., v0.5.2)

jobs:
  build-arch-package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          pacman -Syu --noconfirm base-devel git rust cargo cmake webkit2gtk-4.1 libayatana-appindicator librsvg jq

      - name: Prepare Build Environment & PKGBUILD
        run: |
          # Create a non-root build user (makepkg refuses to run as root)
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          su builder -c 'git config --global --add safe.directory "$PWD"'

      - name: Build Package via makepkg
        run: |
          su builder -c '
            # Extract git version for PKGBUILD pkgver
            GIT_DESCRIBE=$(git describe --tags --always | sed "s/^v//")
            PKGVER=$(echo "$GIT_DESCRIBE" | sed "s/-/./g; s/-/r/")
            
            # Generate PKGBUILD dynamically with all customizations
            cat <<EOF > PKGBUILD
pkgname=misterdownloadmanager-bin
pkgver=${PKGVER}
pkgrel=1
pkgdesc="IDM (MisterDownloadManager) - Modern download manager"
arch=("x86_64")
url="https://github.com/${{ github.repository }}"
license=("custom")
depends=("gtk3" "webkit2gtk-4.1" "libayatana-appindicator" "hicolor-icon-theme")
makedepends=("rust" "cargo" "cmake" "librsvg")
provides=("misterdownloadmanager" "idm")
conflicts=("misterdownloadmanager")
options=("!strip")
source=()
sha256sums=()

build() {
    cargo build --release
}

package() {
    # Install core binary & nmhost helper
    install -dm755 "\${pkgdir}/opt/misterdownloadmanager"
    install -dm755 "\${pkgdir}/usr/bin"
    
    install -Dm755 target/release/misterdownloadmanager "\${pkgdir}/opt/misterdownloadmanager/misterdownloadmanager"
    [[ -f target/release/misterdownloadmanager-nmhost ]] && install -Dm755 target/release/misterdownloadmanager-nmhost "\${pkgdir}/opt/misterdownloadmanager/misterdownloadmanager-nmhost"

    # Symlink 'idm' and 'misterdownloadmanager' to /usr/bin
    ln -s "/opt/misterdownloadmanager/misterdownloadmanager" "\${pkgdir}/usr/bin/idm"
    ln -s "/opt/misterdownloadmanager/misterdownloadmanager" "\${pkgdir}/usr/bin/misterdownloadmanager"

    # Install custom SVG vector icon
    install -dm755 "\${pkgdir}/usr/share/icons/hicolor/scalable/apps"
    install -dm755 "\${pkgdir}/usr/share/pixmaps"

    cat << "ICON" > "\${pkgdir}/usr/share/icons/hicolor/scalable/apps/idm.svg"
<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 30 445 450" width="512" height="512">
  <defs>
    <radialGradient id="dropGlow" cx="50%" cy="50%" r="50%">
      <stop offset="65%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="globeSphere" cx="34%" cy="25%" r="72%" fx="30%" fy="22%">
      <stop offset="0%" stop-color="#8CE3FF"/>
      <stop offset="28%" stop-color="#35AEFF"/>
      <stop offset="68%" stop-color="#0B78E3"/>
      <stop offset="100%" stop-color="#04489C"/>
    </radialGradient>
    <linearGradient id="globeGloss" x1="18%" y1="8%" x2="68%" y2="72%">
      <stop offset="0%" stop-color="#D4F2FF" stop-opacity="0.96"/>
      <stop offset="55%" stop-color="#6BCAFF" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#2FA4F7" stop-opacity="0.75"/>
